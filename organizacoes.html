<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Organizações</title>
    <link rel="stylesheet" href="src/style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="container">
        <header class="module-page-header">
            <div class="logo-area">
                <div>
                    <h1 class="module-title">Gestão de Organizações</h1>
                </div>
            </div>
            <div class="actions">
                <button id="themeToggleBtn" class="btn btn-outline" type="button" title="Alternar tema">
                    <i data-role="theme-icon" data-lucide="sun"></i>
                </button>
                <a href="index.html" class="btn btn-outline">Voltar</a>
            </div>
        </header>

        <section class="module-section-head module-toolbar">
            <div>
                <h2>Organizações cadastradas</h2>
            </div>
            <div class="module-toolbar-actions">
                <span id="orgsCount" class="tag module-count">0 itens</span>
                <button id="orgNewBtn" class="btn btn-primary" type="button" title="Nova Organização">
                    Nova Organização
                </button>
            </div>
        </section>

        <section style="overflow-x: auto;">
            <table class="pr-table" style="width: 100%;">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Usuários</th>
                        <th>Status</th>
                        <th>Criada em</th>
                        <th style="width: 110px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="orgsTableBody"></tbody>
            </table>
        </section>
    </div>

    <!-- Formulário de criação (modal interno da rota, mesmo padrão de usuarios.html) -->
    <div id="orgModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 680px;">
            <div class="modal-header">
                <h2 id="orgFormTitle">Nova organização</h2>
                <button class="close-btn" type="button" aria-label="Fechar">&times;</button>
            </div>

            <form id="orgForm" class="module-form">
                <input type="hidden" id="orgFormId" value="">

                <label class="module-field" style="grid-column: 1 / -1;">
                    <span>Nome da organização</span>
                    <input id="orgFormName" type="text" required placeholder="Nome da empresa/organização">
                </label>

                <label class="module-field org-admin-field">
                    <span>Nome do admin</span>
                    <input id="orgFormAdminName" type="text" placeholder="Nome completo">
                </label>

                <label class="module-field org-admin-field">
                    <span>Email do admin</span>
                    <input id="orgFormAdminEmail" type="email" placeholder="pessoa@empresa.com">
                </label>

                <label class="module-field org-admin-field">
                    <span>Senha inicial</span>
                    <input id="orgFormAdminPassword" type="password" autocomplete="new-password">
                </label>

                <div class="module-form-actions">
                    <button class="btn btn-primary" type="submit">Salvar</button>
                    <button class="btn btn-outline close-modal" type="button">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="src/organizationsAdmin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.lucide) {
                    lucide.createIcons();
                }
            }, 100);
        });
    </script>
</body>

</html>
