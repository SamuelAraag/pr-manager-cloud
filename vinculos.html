<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações de cadastro de PR - PR Manager</title>
    <link rel="stylesheet" href="src/style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="container">
        <header class="module-page-header">
            <div class="logo-area">
                <div>
                    <h1 class="module-title">Configurações de cadastro de PR</h1>
                    <p id="linkFieldsAppName" style="color: var(--text-secondary); margin: 0.2rem 0 0;"></p>
                </div>
            </div>
            <div class="actions">
                <button id="themeToggleBtn" class="btn btn-outline" type="button" title="Alternar tema">
                    <i data-role="theme-icon" data-lucide="sun"></i>
                </button>
                <a href="apps.html" class="btn btn-outline">Voltar</a>
            </div>
        </header>

        <section class="module-section-head module-toolbar">
            <div>
                <h2>Campos personalizados do formulário de PR</h2>
            </div>
            <div class="module-toolbar-actions">
                <span id="linkFieldsCount" class="tag module-count">0 itens</span>
                <button id="linkFieldNewBtn" class="btn btn-primary" type="button" data-roles="Admin"
                    style="display: none;">+ Novo</button>
            </div>
        </section>

        <p class="module-hint"
            style="color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 1rem; padding: 0.6rem 0.8rem; border-left: 3px solid var(--border-color);">
            Branch de destino, Task e Pull Request são fixos em todo PR e não entram aqui. Todo campo cadastrado aqui é um link.
        </p>

        <div id="linkFieldsState"></div>

        <div id="linkFieldsTableWrap" style="overflow-x: auto; display: none;">
            <table class="pr-table" style="width: 100%;">
                <thead>
                    <tr>
                        <th>Rótulo</th>
                        <th style="width: 130px;">Obrigatório</th>
                        <th style="width: 110px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="linkFieldsTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Criar / editar campo (modal interno da rota) -->
    <div id="linkFieldModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 460px;">
            <div class="modal-header">
                <h2 id="linkFieldModalTitle">Novo campo</h2>
                <button class="close-btn" type="button" aria-label="Fechar">&times;</button>
            </div>
            <form id="linkFieldForm" class="module-form">
                <input type="hidden" id="linkFieldId" value="">
                <label class="module-field">
                    <span>Rótulo</span>
                    <input id="linkFieldLabel" type="text" required maxlength="120" placeholder="Ex: Chat do time">
                    <span class="field-error">Informe o rótulo do vínculo.</span>
                </label>
                <label class="module-field module-field-inline"
                    style="display: flex; align-items: center; gap: 0.5rem;">
                    <input id="linkFieldRequired" type="checkbox" style="width: 16px; height: 16px;">
                    <span>Obrigatório ao criar um PR</span>
                </label>
                <div class="module-form-actions">
                    <button class="btn btn-outline close-modal" type="button">Cancelar</button>
                    <button id="linkFieldFormSubmit" class="btn btn-primary" type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Diálogo de confirmação em UI (00-principles.md proíbe confirm() nativo) -->
    <div id="confirmDialog" class="modal-overlay">
        <div class="modal-content" style="max-width: 460px;">
            <div class="modal-header">
                <h2 id="confirmDialogTitle">Confirmar ação</h2>
            </div>
            <p id="confirmDialogMessage" style="color: var(--text-secondary);"></p>
            <div class="module-form-actions">
                <button id="confirmDialogNo" class="btn btn-outline" type="button">Cancelar</button>
                <button id="confirmDialogYes" class="btn btn-primary" type="button">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Diálogo de aviso em UI (00-principles.md proíbe alert() nativo) -->
    <div id="alertDialog" class="modal-overlay">
        <div class="modal-content" style="max-width: 420px;">
            <div class="modal-header">
                <h2 id="alertDialogTitle">Aviso</h2>
            </div>
            <p id="alertDialogMessage" style="color: var(--text-secondary);"></p>
            <div class="module-form-actions">
                <button id="alertDialogOk" class="btn btn-primary" type="button">OK</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="src/linkFields.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.lucide) {
                    lucide.createIcons();
                }
            }, 100);
        });
    </script>
</body>

</html>
