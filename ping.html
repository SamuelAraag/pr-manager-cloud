<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Status - Terminal</title>
    <style>
        /* Importação de fonte monoespaçada de alta qualidade */
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0c0c0c;
            font-family: 'Fira Code', 'Courier New', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #00ff41;
        }

        /* Container principal com estética de terminal premium */
        .terminal-window {
            width: 85%;
            height: 80vh;
            background: rgba(18, 18, 18, 0.95);
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Barra superior da janela */
        .terminal-top-bar {
            background: #1e1e1e;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
        }

        .dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .terminal-title {
            color: #888;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* Área de logs com scroll customizado */
        #logContainer {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 50px;
        }

        #logContainer::-webkit-scrollbar {
            width: 6px;
        }

        #logContainer::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        /* Estilo para cada linha do terminal */
        .log-entry {
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0;
            display: flex;
            gap: 12px;
        }

        .timestamp {
            color: #555;
            user-select: none;
            flex-shrink: 0;
        }

        .status-badge {
            font-weight: 500;
        }

        .status-up { color: #00ff41; text-shadow: 0 0 10px rgba(0, 255, 65, 0.3); }
        .status-down { color: #ff3e3e; text-shadow: 0 0 10px rgba(255, 62, 62, 0.3); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Efeito de scanline para visual clássico */
        .terminal-window::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 100, 0.03));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="terminal-window">
        <div class="terminal-top-bar">
            <div class="dots">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <div class="terminal-title">SISTEMA DE MONITORAMENTO - PR MANAGER</div>
            <div></div> <!-- Espaçador -->
        </div>
        <div id="logContainer">
            <div class="log-entry">
                <span class="timestamp">[INICIALIZADO]</span>
                <span>Iniciando monitoramento de serviços...</span>
            </div>
        </div>
    </div>

    <script src="script-ping.js"></script>
</body>
</html>
